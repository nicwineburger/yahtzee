# Repo-specific automation config — the ONLY file the generic automation
# layer expects you to edit per-repo. Sourced by scripts/automation/lib.sh.
# Plain KEY=VALUE shell assignments only; no logic.

DEFAULT_BRANCH=main
MERGE_STRATEGY=squash

RELEASE_TAG_PREFIX=v
INITIAL_VERSION=0.1.0

# Full test suite (run from repo root) and optional secondary suite.
TEST_CMD="npm test"
MATH_TEST_CMD="cd math && ../.venv/bin/python test_yacht_clubhouse.py"

# The image CI jobs run inside. Every tool they need is already in it, so no
# job installs tooling at run time — see .github/docker/ci.Dockerfile and the
# "CI images" section of scripts/automation/README.md. Pinned by DIGEST: tags
# are mutable, digests are not. Update = edit the Dockerfile, let ci-image.yml
# publish, then repin here and in pr.yml / pages.yml.
CI_IMAGE="ghcr.io/nicwineburger/yahtzee-ci@sha256:23def4896a8d7f259b3fa17a1c8161d7d031dabad292037c66737c1062ae96bc"

# Same suites as run by claude.yml's implement job, which now runs in CI_IMAGE.
# Setup is project dependencies only (lockfile-pinned); browsers, python,
# numpy/tqdm and gh come from the image. If you find yourself adding an
# install here, add it to the Dockerfile instead.
# CI_TEST_SETUP failing is not fatal; it only means Claude can't self-verify.
CI_TEST_SETUP="npm ci"
CI_TEST_CMD="npm test"
CI_MATH_TEST_CMD="cd math && python3 test_yacht_clubhouse.py"

COMMIT_TYPES="feat fix docs style refactor perf test build ci chore revert"
# Space-separated scope allowlist; empty = any lowercase scope accepted.
COMMIT_SCOPES=""
SUBJECT_MAX_LEN=72

BRANCH_TYPES="feat fix chore docs refactor test ci perf"

# issue-flow: review/fix rounds before escalating to the user.
REVIEW_MAX_ROUNDS=3

# export-template.sh leak check: the exported generic layer must not contain
# any of these repo-specific words (owner name, project names).
TEMPLATE_LEAK_WORDS="yahtzee yacht nicwineburger clubhouse"

# Maps the issue-template "### Area" dropdown value (verbatim option text,
# see .github/ISSUE_TEMPLATE/*.yml) to a GitHub label. Semicolon-separated
# "dropdown text=label" pairs. Used by scripts/automation/setup-labels.sh
# (to create the labels) and by claude.yml / the expand-issue skill (to
# apply the matching label when requirements are posted).
AREA_LABEL_MAP="web app (docs/)=area:webapp;solver (math/)=area:solver;automation / CI=area:automation"
