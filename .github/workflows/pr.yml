name: PR checks

on:
  pull_request:
    branches: [main]
    # 'edited' re-lints when the PR title changes (the title becomes the
    # squash commit on main).
    types: [opened, edited, synchronize, reopened]
  # Fallback for PRs opened by claude.yml's `implement` job: PRs created
  # with the workflow's GITHUB_TOKEN land in an approval-required state for
  # pull_request events rather than just running (GitHub's github_token
  # concept docs), so that job dispatches this workflow directly instead —
  # workflow_dispatch always creates a run regardless of which token
  # triggered it, with zero new secrets. Checks still attach to the PR's
  # head SHA this way, so `gh pr checks` / pr-merge.sh see them normally.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to lint (set by claude.yml's implement job)"
        required: true

concurrency:
  group: pr-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Blob-filtered sparse checkout — skips the 2.5 GiB math/data pack (see claude.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/math/data/
          sparse-checkout-cone-mode: false
      - name: Resolve PR title (workflow_dispatch has no pull_request context)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          EVENT_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TITLE="$(gh pr view "$PR_NUMBER" --json title -q .title)"
          else
            TITLE="$EVENT_TITLE"
          fi
          printf 'title=%s\n' "$TITLE" >>"$GITHUB_OUTPUT"
      - name: PR title must be a conventional commit
        env:
          PR_TITLE: ${{ steps.pr.outputs.title }}
        run: ./scripts/automation/lint-commit.sh --message "$PR_TITLE"

  # Test jobs mirror .github/workflows/pages.yml so PRs get the same
  # coverage pre-merge that deploys get post-merge.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Every tool this job needs is already in the image (see
    # .github/docker/ci.Dockerfile) — it installs nothing but this project's
    # own lockfile-pinned deps. Pinned by digest: tags are mutable.
    # Keep in sync with CI_IMAGE in .automation.conf and pages.yml.
    container:
      image: ghcr.io/nicwineburger/yahtzee-ci@sha256:23def4896a8d7f259b3fa17a1c8161d7d031dabad292037c66737c1062ae96bc
      # GITHUB_TOKEN-pushed ghcr packages are private by default; these
      # credentials make the pull work whether or not the package is public.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm ci
      - name: Engine regression test vs Python-solver fixtures
        run: npm run test:engine
      - name: Engine property tests
        run: npm run test:engine-extra
      - name: UI tests (both modes, mobile viewport)
        run: npm run test:ui

  test-math:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Python + numpy/tqdm come from the image, so this job no longer needs
    # setup-python or a pip install whose versions float to whatever the index
    # serves that minute.
    container:
      image: ghcr.io/nicwineburger/yahtzee-ci@sha256:23def4896a8d7f259b3fa17a1c8161d7d031dabad292037c66737c1062ae96bc
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Solver + export tests
        run: python3 test_yacht_clubhouse.py
        working-directory: math
