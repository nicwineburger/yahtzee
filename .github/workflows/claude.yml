name: Claude

# Event-driven automation via the Claude GitHub App. Inert (green no-op with
# a notice) until the app is installed (/install-github-app) and an
# ANTHROPIC_API_KEY repo secret exists. See scripts/automation/README.md.

on:
  issues:
    # 'closed' drives the status-label lifecycle to its terminal state (see
    # the close-out job); every job below guards on the action it wants.
    types: [opened, labeled, closed]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # New human-filed issue -> expand it into full requirements on the issue.
  # Guarded to 'opened' only: without it this job would also refire on
  # every label change now that issues.types includes 'labeled' (needed by
  # the implement job below).
  expand-issue:
    if: >-
      github.event_name == 'issues' && github.event.action == 'opened' &&
      github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      id-token: write # Required: the GitHub App exchanges this OIDC token for its API token
    steps:
      - id: key
        name: Check for ANTHROPIC_API_KEY
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: echo "present=$HAS_KEY" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.present != 'true'
        name: Notice — automation inert without ANTHROPIC_API_KEY
        run: echo "::notice::ANTHROPIC_API_KEY secret not set — Claude automation is inert (see scripts/automation/README.md)"
      - if: steps.key.outputs.present == 'true'
        name: Checkout (sparse — skips math/data)
        # Blob-filtered sparse checkout: math/data holds ~2.5 GiB of binary
        # solver shards (24k+ files) that no Claude job reads; a full fetch
        # of that pack once took 18 minutes (run 30108055561). The exclude
        # pattern is harmless in repos without the path (template export:
        # EDIT to match your repo's large committed data dirs, or drop).
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/math/data/
          sparse-checkout-cone-mode: false
      # Model writes, workflow posts: earlier revisions let Claude call
      # `gh issue comment` / `gh api` itself via Bash, but the action's
      # prefix-rule matcher misses shell shapes Claude is free to type
      # (`cd ... && scripts/...`, `bash scripts/...`, etc.), so calls kept
      # getting denied even with the rules loaded (run 30084164305). No Bash
      # at all here — Claude only reads the repo and writes the comment body
      # to a file; the deterministic step below does the actual posting.
      - if: steps.key.outputs.present == 'true'
        id: claude
        name: Expand issue into requirements (Claude)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Write a complete requirements comment for GitHub issue
            #${{ github.event.issue.number }} in this repository to the file
            /tmp/requirements-comment.md.

            Issue title: ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

            Explore the repository with Read/Grep/Glob to understand current
            behavior before specifying new behavior (cite real file paths).
            Check CLAUDE.md for constraints that shape the requirements. You
            have no Bash access in this run — do not attempt to run commands
            or post anything yourself; only write the file.

            The file's FIRST LINE must be exactly this marker:
            <!-- claude:requirements v1 -->

            Follow it with a `## Expanded requirements` heading, then these
            sections in this order (mirroring
            scripts/automation/templates/requirements-comment.md):
            - `### Goal`
            - `### Background & current behavior` (cite real file paths)
            - `### Functional requirements` (numbered, individually testable)
            - `### Non-goals`
            - `### Acceptance criteria` (a checklist a reviewer can verify
              mechanically)
            - `### Test plan` (name actual test files/commands)
            - `### Open questions` (ONLY things you genuinely cannot decide
              from the code, the issue, or repo conventions)

            Set the structured output `written` field to true only once the
            file has actually been written with the marker as its first
            line; otherwise set it false and explain why in `reason`.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Write"
            --json-schema '{"type":"object","properties":{"written":{"type":"boolean","description":"true only if /tmp/requirements-comment.md was written with the marker line first"},"reason":{"type":"string","description":"why writing failed or was skipped; empty string if written is true"}},"required":["written","reason"]}'
      - name: Claude execution summary
        # Always runs (even when the Claude step fails) so the run's Summary
        # page says what Claude actually did: turns, cost, duration, result.
        if: always() && steps.key.outputs.present == 'true' && steps.claude.outcome != 'skipped'
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          {
            echo "## Claude execution (${CLAUDE_OUTCOME})"
            if [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ]; then
              jq -r '(last // {}) |
                "- turns: \(.num_turns // "?")",
                "- duration: \((.duration_ms // 0) / 1000 | round)s",
                "- cost: $\(.total_cost_usd // "?")",
                "- is_error: \(if .is_error == null then "?" else .is_error end)",
                "",
                "<details><summary>final result</summary>",
                "",
                "\(.result // "(none)")",
                "",
                "</details>"' "$EXEC_FILE" 2>/dev/null \
                || echo "- execution log exists but could not be parsed (see artifact)"
            else
              echo "- no execution log produced (step failed before Claude ran?)"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload Claude execution log
        if: always() && steps.key.outputs.present == 'true' && steps.claude.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-expand-issue-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.claude.outputs.execution_file }}
            /tmp/requirements-comment.md
          if-no-files-found: ignore
          retention-days: 14
      - if: steps.key.outputs.present == 'true'
        name: Post requirements comment
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ steps.claude.outputs.structured_output }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          FILE: /tmp/requirements-comment.md
        run: |
          if [ -z "$OUTPUT" ] || [ "$(printf '%s' "$OUTPUT" | jq -r '.written // false')" != "true" ]; then
            echo "::error::expand-issue did not write a requirements file (structured_output: ${OUTPUT:-<empty>})"
            exit 1
          fi
          if [ ! -f "$FILE" ]; then
            echo "::error::expand-issue reported written=true but $FILE is missing"
            exit 1
          fi
          FIRST_LINE="$(head -n1 "$FILE")"
          if [ "$FIRST_LINE" != "<!-- claude:requirements v1 -->" ]; then
            echo "::error::$FILE does not start with the <!-- claude:requirements v1 --> marker (got: $FIRST_LINE)"
            exit 1
          fi

          EXISTING_ID="$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- claude:requirements"))] | last | .id // empty')"

          if [ -n "$EXISTING_ID" ]; then
            COMMENT_URL="$(gh api "repos/$REPO/issues/comments/$EXISTING_ID" -X PATCH -F body=@"$FILE" --jq '.html_url')"
          else
            # `gh issue comment` has no --json/--jq output flags; it prints
            # the new comment's URL to stdout on success.
            COMMENT_URL="$(gh issue comment "$ISSUE" --body-file "$FILE")"
          fi
          echo "Posted requirements comment: $COMMENT_URL"
          printf '## Requirements posted\n- issue: #%s\n- comment: %s\n' "$ISSUE" "$COMMENT_URL" >>"$GITHUB_STEP_SUMMARY"

          # Deterministic labeling (not model-decided). set-status.sh keeps
          # the status:* labels mutually exclusive and creates them if the
          # repo doesn't have them yet, so no manual setup-labels.sh run is
          # needed first. Labeling must never fail the job — warn and move on.
          scripts/automation/set-status.sh "$ISSUE" status:requirements \
            || echo "::warning::could not set status:requirements on issue #$ISSUE (see log above)"

          # Map the issue-form "### Area" dropdown value to an area label via
          # AREA_LABEL_MAP in .automation.conf (repo-specific dropdown text
          # stays out of this generic workflow file).
          . "$GITHUB_WORKSPACE/.automation.conf"
          AREA_VALUE="$(printf '%s\n' "$ISSUE_BODY" | awk '
            /^### Area/ { found=1; next }
            found && /^### / { exit }
            found && NF { print; exit }
          ')"
          if [ -n "$AREA_VALUE" ]; then
            AREA_MATCHED=0
            OLD_IFS="$IFS"
            IFS=';'
            for pair in $AREA_LABEL_MAP; do
              IFS="$OLD_IFS"
              [ -n "$pair" ] || continue
              area_text="${pair%%=*}"
              area_label="${pair#*=}"
              if [ "$area_text" = "$AREA_VALUE" ]; then
                AREA_MATCHED=1
                if ! gh issue edit "$ISSUE" --add-label "$area_label" 2>/tmp/label-err.txt; then
                  echo "::warning::could not apply label '$area_label' ($(cat /tmp/label-err.txt))"
                fi
                break
              fi
              IFS=';'
            done
            IFS="$OLD_IFS"
            # A dropdown option with no mapping (e.g. "other") is normal; an
            # unexplained miss means AREA_LABEL_MAP has drifted from the issue
            # template, which is worth seeing in the log rather than guessing.
            [ "$AREA_MATCHED" = 1 ] \
              || echo "::notice::issue #$ISSUE area '$AREA_VALUE' has no AREA_LABEL_MAP entry — no area label applied"
          else
            # Free-form issues (filed without the issue form) have no '### Area'
            # section at all, so they silently got no area label before this.
            echo "::notice::issue #$ISSUE has no '### Area' section (filed without the issue form) — no area label applied"
          fi

  # Terminal state of the status lifecycle: an issue closing (normally by a
  # merged PR's "Closes #N", but a manual close counts too) means no status
  # applies any more. Without this the issue keeps status:in-progress
  # forever, which is what made the labels untrustworthy. Deterministic
  # bookkeeping only — no Claude, so no ANTHROPIC_API_KEY gate here.
  close-out:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout (sparse — skips math/data)
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/math/data/
          sparse-checkout-cone-mode: false
      - name: Clear status labels
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          scripts/automation/set-status.sh "$ISSUE" none \
            || echo "::warning::could not clear status labels on issue #$ISSUE (see log above)"

  # @claude mentions in issue/PR comments (humans only; bot comments never
  # retrigger — that also keeps the automation's own comments from looping).
  mention:
    if: >-
      github.event_name != 'issues' &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # Required: the GitHub App exchanges this OIDC token for its API token
      actions: read # Lets Claude read CI results when replying on PRs
    steps:
      - id: key
        name: Check for ANTHROPIC_API_KEY
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: echo "present=$HAS_KEY" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.present != 'true'
        name: Notice — automation inert without ANTHROPIC_API_KEY
        run: echo "::notice::ANTHROPIC_API_KEY secret not set — Claude automation is inert (see scripts/automation/README.md)"
      - if: steps.key.outputs.present == 'true'
        name: Checkout (sparse — skips math/data)
        # Same blob-filtered sparse checkout as expand-issue (math/data excluded).
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/math/data/
          sparse-checkout-cone-mode: false
      - if: steps.key.outputs.present == 'true'
        name: Answer @claude mention (Claude)
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Safe to grant repo script access: the action only runs this job
          # for actors with repo write access by default (docs/security.md).
          claude_args: |
            --allowedTools "Bash(scripts/automation/*.sh:*),Bash(./scripts/automation/*.sh:*)"

  # `implement` label added to a requirements-bearing issue -> implement the
  # change on a branch and open a PR. Same "model edits, workflow does the
  # git" split as expand-issue: Claude gets file tools only (no Bash), and
  # deterministic steps do branch/commit/push/PR with a lint-checked
  # conventional title taken from structured output.
  implement:
    if: >-
      github.event_name == 'issues' && github.event.action == 'labeled' &&
      github.event.label.name == 'implement' &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # Required: the GitHub App exchanges this OIDC token for its API token
      # actions: write (not just read) is needed for the workflow_dispatch
      # fallback that kicks off pr.yml below (see the "Branch, commit, push,
      # open PR" step for why pull_request doesn't fire on its own here).
      actions: write
    steps:
      - id: key
        name: Check for ANTHROPIC_API_KEY
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: echo "present=$HAS_KEY" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.present != 'true'
        name: Notice — automation inert without ANTHROPIC_API_KEY
        run: echo "::notice::ANTHROPIC_API_KEY secret not set — Claude automation is inert (see scripts/automation/README.md)"
      - if: steps.key.outputs.present == 'true'
        name: Checkout (sparse — skips math/data)
        # Same blob-filtered sparse checkout as expand-issue (math/data excluded).
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/math/data/
          sparse-checkout-cone-mode: false
      - if: steps.key.outputs.present == 'true'
        id: conf
        name: Consume trigger label + fetch requirements
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Consume the label immediately: re-adding 'implement' later is the
          # retry mechanism for a stuck/failed run, so this must happen
          # before anything that can fail below.
          if ! gh issue edit "$ISSUE" --remove-label implement 2>/tmp/label-err.txt; then
            echo "::warning::could not remove 'implement' label ($(cat /tmp/label-err.txt))"
          fi

          # Same selection expression as expand-issue's post step: the
          # latest comment whose body starts with the requirements marker.
          REQ_BODY="$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- claude:requirements"))] | last | .body // empty')"

          if [ -z "$REQ_BODY" ]; then
            echo "::error::issue #$ISSUE has no <!-- claude:requirements --> comment yet — wait for expand-issue to post one (or run the expand-issue skill / comment @claude to request it) before adding 'implement'"
            exit 1
          fi

          {
            printf '# Issue #%s: %s\n\n' "$ISSUE" "$ISSUE_TITLE"
            printf '## Issue body\n\n%s\n\n' "$ISSUE_BODY"
            printf '## Expanded requirements\n\n%s\n' "$REQ_BODY"
          } >/tmp/issue-context.md

          # Feed the commit contract to the prompt below from .automation.conf
          # rather than hardcoding it there — the limits the title is checked
          # against and the ones Claude is told about must be the same values,
          # and this file stays template-generic.
          . "$GITHUB_WORKSPACE/.automation.conf"
          {
            printf 'subject_max_len=%s\n' "$SUBJECT_MAX_LEN"
            printf 'branch_types=%s\n' "$BRANCH_TYPES"
            printf 'ci_test_cmd=%s\n' "$CI_TEST_CMD"
            printf 'ci_math_test_cmd=%s\n' "$CI_MATH_TEST_CMD"
          } >>"$GITHUB_OUTPUT"
      - if: steps.key.outputs.present == 'true'
        id: testenv
        name: Prepare test environment
        # Claude can only verify its own change if the suites can actually
        # run here: deps installed, and the browsers the UI tests drive
        # present (the runner is not the Playwright container pr.yml's test
        # job uses). Never fatal — a registry hiccup shouldn't kill a run
        # that can still produce a correct change; Claude is told to say so
        # when it couldn't test, and pr.yml remains the real gate.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ""
        run: |
          . "$GITHUB_WORKSPACE/.automation.conf"
          if eval "$CI_TEST_SETUP"; then
            echo "ready=true" >>"$GITHUB_OUTPUT"
          else
            echo "ready=false" >>"$GITHUB_OUTPUT"
            echo "::warning::test environment setup failed — Claude will not be able to run the suite in this run"
          fi
      - if: steps.key.outputs.present == 'true'
        id: claude
        name: Implement change in working tree (Claude)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Implement the change described in /tmp/issue-context.md in this
            working tree.

            Read /tmp/issue-context.md first — it has the issue title, body,
            and the full expanded requirements (functional requirements,
            acceptance criteria, test plan). Explore the repository with
            Read/Grep/Glob before editing so your changes match existing
            patterns. Check CLAUDE.md for constraints that shape the
            implementation and obey them exactly. Include tests per the
            requirements' test plan.

            VERIFY YOUR CHANGE BEFORE FINISHING. Test environment ready:
            ${{ steps.testenv.outputs.ready }}. When that says true, run
            `${{ steps.conf.outputs.ci_test_cmd }}` and keep working until it
            passes; if you touched the secondary suite's area, also run
            `${{ steps.conf.outputs.ci_math_test_cmd }}`. A failing test you
            caused is yours to fix — including an EXISTING test that your
            change makes wrong: update it to assert the new intended
            behavior, don't leave it failing and don't weaken it to pass.
            When it says false, skip the commands and say so in `tests`.

            Bash is limited to running tests and their tooling (npm, npx,
            node, python3). Do NOT run git or gh — a deterministic workflow
            step handles branch/commit/push/PR after you finish, and that
            split is what keeps this job's git history trustworthy.

            Set the structured output:
            - implemented: true only if you actually made the changes in the
              working tree; otherwise false, with reason explaining why.
            - pr_title: a conventional-commit subject
              `<type>(<scope>): <summary>` describing the WHOLE change — it
              becomes the PR title and the squash commit on main. Hard
              requirements, checked by CI:
              * type MUST be one of:
                ${{ steps.conf.outputs.branch_types }}
              * the WHOLE line, counting the `<type>(<scope>): ` prefix,
                MUST be at most ${{ steps.conf.outputs.subject_max_len }}
                characters — count them, and aim ~10 under to be safe. A
                short title plus detail in `summary` beats a long title;
                an over-long one gets truncated at a word boundary.
              * no trailing period.
            - summary: the PR body as markdown, with `## Summary`,
              `## Changes`, and `## Test plan` sections.
            - tests: one line stating the exact command(s) you ran and the
              result, or why you ran none. Report this honestly — it is
              published on the PR, and pr.yml re-runs the same suite anyway.
            - reason: why implementation failed or was skipped; empty string
              if implemented is true.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Write,Edit,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(python3:*),Bash(cd:*)"
            --disallowedTools "Bash(git:*),Bash(gh:*)"
            --json-schema '{"type":"object","properties":{"implemented":{"type":"boolean","description":"true only if the working tree was actually changed"},"pr_title":{"type":"string","description":"conventional commit subject describing the whole change; type from [${{ steps.conf.outputs.branch_types }}], at most ${{ steps.conf.outputs.subject_max_len }} characters including the type/scope prefix, no trailing period"},"summary":{"type":"string","description":"markdown PR body: Summary/Changes/Test plan"},"tests":{"type":"string","description":"exact test command(s) run and their result, or why none were run"},"reason":{"type":"string","description":"why implementation failed or was skipped; empty string if implemented is true"}},"required":["implemented","pr_title","summary","tests","reason"]}'
      - name: Claude execution summary
        # Always runs (even when the Claude step fails) so the run's Summary
        # page says what Claude actually did: turns, cost, duration, result.
        if: always() && steps.key.outputs.present == 'true' && steps.claude.outcome != 'skipped'
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          {
            echo "## Claude execution (${CLAUDE_OUTCOME})"
            if [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ]; then
              jq -r '(last // {}) |
                "- turns: \(.num_turns // "?")",
                "- duration: \((.duration_ms // 0) / 1000 | round)s",
                "- cost: $\(.total_cost_usd // "?")",
                "- is_error: \(if .is_error == null then "?" else .is_error end)",
                "",
                "<details><summary>final result</summary>",
                "",
                "\(.result // "(none)")",
                "",
                "</details>"' "$EXEC_FILE" 2>/dev/null \
                || echo "- execution log exists but could not be parsed (see artifact)"
            else
              echo "- no execution log produced (step failed before Claude ran?)"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload Claude execution log
        if: always() && steps.key.outputs.present == 'true' && steps.claude.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-implement-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.claude.outputs.execution_file }}
            /tmp/issue-context.md
          if-no-files-found: ignore
          retention-days: 14
      - if: steps.key.outputs.present == 'true'
        name: Branch, commit, push, open PR
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ steps.claude.outputs.structured_output }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          SENDER: ${{ github.event.sender.login }}
          WORKFLOWS_PAT: ${{ secrets.WORKFLOWS_PAT }}
        run: |
          # claude-code-action revokes its app token and rewrites the git
          # credentials during its in-step cleanup, so this step cannot rely
          # on checkout's persisted auth for pushing (run 30086522159 failed
          # exactly there). Point origin at the job token explicitly; the
          # token is secret-masked in logs.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          IMPLEMENTED="$(printf '%s' "$OUTPUT" | jq -r '.implemented // false')"
          if [ "$IMPLEMENTED" != "true" ]; then
            REASON="$(printf '%s' "$OUTPUT" | jq -r '.reason // "no reason given"')"
            echo "::error::implement job: Claude did not implement the change: $REASON"
            exit 1
          fi
          if [ -z "$(git status --porcelain)" ]; then
            echo "::error::implement job: implemented=true but the working tree is clean (no changes found)"
            exit 1
          fi

          # GitHub refuses pushes that create/update .github/workflows/**
          # with the Actions job token — a platform restriction, not a repo
          # setting (run 30100553667 died there after doing all the work).
          # Fail fast with guidance, unless a WORKFLOWS_PAT secret
          # (fine-grained PAT: contents + workflows write) is configured.
          if git status --porcelain | awk '{print $2}' | grep -q '^\.github/workflows/'; then
            if [ -n "$WORKFLOWS_PAT" ]; then
              echo "::notice::change touches .github/workflows/** — pushing with WORKFLOWS_PAT instead of the job token"
              git remote set-url origin "https://x-access-token:${WORKFLOWS_PAT}@github.com/${REPO}.git"
            else
              echo "::error::implementation touches .github/workflows/**, which the Actions token cannot push (GitHub platform restriction). Options: run /issue-flow $ISSUE locally (pushes as you), or add a WORKFLOWS_PAT repo secret (fine-grained PAT with contents+workflows write) and re-add the 'implement' label to retry."
              exit 1
            fi
          fi

          PR_TITLE_RAW="$(printf '%s' "$OUTPUT" | jq -r '.pr_title')"
          PR_SUMMARY="$(printf '%s' "$OUTPUT" | jq -r '.summary')"

          # A model-authored title that overshoots SUBJECT_MAX_LEN by a few
          # characters used to fail the whole job here, throwing away a
          # finished implementation (run 30110961060: 75 chars, max 72).
          # normalize-subject.sh repairs the mechanical defects (length,
          # trailing punctuation, stray whitespace) and re-lints; structural
          # problems (bad type, no colon) are still a hard failure, since
          # guessing a type would change what the commit claims to be.
          if ! PR_TITLE="$(scripts/automation/normalize-subject.sh --message "$PR_TITLE_RAW")"; then
            echo "::error::implement job: pr_title is not a repairable conventional-commit subject: $PR_TITLE_RAW"
            exit 1
          fi
          if [ "$PR_TITLE" != "$PR_TITLE_RAW" ]; then
            echo "::warning::pr_title repaired to satisfy the commit contract: '$PR_TITLE_RAW' -> '$PR_TITLE'"
          fi

          . "$GITHUB_WORKSPACE/.automation.conf"

          TYPE="$(printf '%s' "$PR_TITLE" | sed -E 's/^([a-z0-9]+)(\([^)]*\))?!?:.*/\1/')"
          printf ' %s ' "$BRANCH_TYPES" | grep -q " $TYPE " \
            || { echo "::error::implement job: pr_title type '$TYPE' not in BRANCH_TYPES ($BRANCH_TYPES): $PR_TITLE"; exit 1; }

          SUMMARY_TEXT="$(printf '%s' "$PR_TITLE" | sed -E 's/^[a-z0-9]+(\([^)]*\))?!?: //')"
          SLUG="$(printf '%s' "$SUMMARY_TEXT" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
          [ -n "$SLUG" ] || { echo "::error::implement job: could not derive a branch slug from pr_title: $PR_TITLE"; exit 1; }

          BRANCH="$TYPE/${ISSUE}-ci-${SLUG}"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::implement job: branch $BRANCH already exists on origin — a previous implement run may still be in progress"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add -A

          MSG_FILE="$(mktemp)"
          {
            printf '%s\n\n' "$PR_TITLE"
            printf '%s\n\n' "$PR_SUMMARY"
            printf 'Closes #%s\n\n' "$ISSUE"
            printf 'Co-Authored-By: Claude <noreply@anthropic.com>\n'
          } >"$MSG_FILE"
          git commit -F "$MSG_FILE"
          rm -f "$MSG_FILE"

          git push -u origin "$BRANCH"

          # What Claude reports running is published verbatim rather than
          # trusted silently — pr.yml re-runs the same suite on this PR, so a
          # claim here that doesn't match reality is visible immediately.
          PR_TESTS="$(printf '%s' "$OUTPUT" | jq -r '.tests // ""')"
          PR_BODY_FILE="$(mktemp)"
          {
            printf '%s\n\n' "$PR_SUMMARY"
            printf 'Closes #%s\n' "$ISSUE"
            [ -z "$PR_TESTS" ] || printf '\n---\n<sub>Tests run in the implement job: %s</sub>\n' "$PR_TESTS"
          } >"$PR_BODY_FILE"
          gh pr create --base "$DEFAULT_BRANCH" --title "$PR_TITLE" --body-file "$PR_BODY_FILE"
          rm -f "$PR_BODY_FILE"

          PR_NUMBER="$(gh pr view "$BRANCH" --json number -q .number)"
          PR_URL="$(gh pr view "$BRANCH" --json url -q .url)"

          # PRs/pushes made with the workflow's GITHUB_TOKEN don't trigger
          # pull_request/push workflows the normal way: per GitHub's docs
          # (github_token concept page), a pull_request event opened/updated
          # by GITHUB_TOKEN lands in an approval-required state rather than
          # just running. workflow_dispatch (unlike pull_request/push) always
          # creates a run regardless of which token triggered it, so pr.yml
          # gained a workflow_dispatch trigger with a pr_number input as the
          # zero-new-secrets way to get its checks running on this PR's head
          # SHA (so `gh pr checks` / pr-merge.sh see them) without adding a
          # PAT or GitHub App installation token as a new repo secret.
          gh workflow run pr.yml --ref "$BRANCH" -f pr_number="$PR_NUMBER"

          # status:requirements -> status:in-progress, as a single exclusive
          # transition (set-status.sh drops whatever other status:* labels the
          # issue carries); the assignee is a separate, unrelated edit.
          scripts/automation/set-status.sh "$ISSUE" status:in-progress \
            || echo "::warning::could not set status:in-progress on issue #$ISSUE (see log above)"
          if ! gh issue edit "$ISSUE" --add-assignee "$SENDER" 2>/tmp/label-err.txt; then
            echo "::warning::could not assign issue #$ISSUE to $SENDER ($(cat /tmp/label-err.txt))"
          fi
          gh issue comment "$ISSUE" --body "Implementation PR: $PR_URL"

          echo "Opened PR: $PR_URL"
          {
            printf '## Implementation PR opened\n- issue: #%s\n- branch: %s\n- PR: %s\n- tests: %s\n\n### Diffstat\n\n```\n' "$ISSUE" "$BRANCH" "$PR_URL" "${PR_TESTS:-(not reported)}"
            git show --stat --format='' HEAD
            printf '```\n'
          } >>"$GITHUB_STEP_SUMMARY"
      # Every failure mode of the step above (unpushable workflow file, a
      # title that can't be repaired, a branch collision, gh pr create denied
      # by repo settings) lands after Claude has already done the work, and
      # the runner is discarded with it. Keep the diff as an artifact so the
      # run is recoverable with `git apply` instead of a full re-run.
      - name: Preserve implementation diff on failure
        if: failure() && steps.key.outputs.present == 'true' && steps.claude.outcome == 'success'
        run: |
          . "$GITHUB_WORKSPACE/.automation.conf"
          # Diff against the base branch, not the index: the failure may have
          # come before or after the local commit, and this captures both
          # (git add -A first so new files count as tracked).
          git add -A
          BASE="origin/$DEFAULT_BRANCH"
          git rev-parse --verify --quiet "$BASE" >/dev/null || BASE=HEAD
          git diff --binary "$BASE" >/tmp/implementation.patch || true
          {
            printf '## Implementation not pushed\n\nThe working tree Claude produced is attached as the '
            printf '`claude-implementation-patch-*` artifact — download it and `git apply` it locally, '
            printf 'or re-add the `implement` label to redo the run.\n\n```\n'
            git diff --stat "$BASE"
            printf '```\n'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload implementation patch
        if: failure() && steps.key.outputs.present == 'true' && steps.claude.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: claude-implementation-patch-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/implementation.patch
          if-no-files-found: ignore
          retention-days: 14
