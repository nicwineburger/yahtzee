name: Deploy Yacht Dice solver to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same image as pr.yml's test job — browsers, node, python, gh all baked
    # in (.github/docker/ci.Dockerfile), nothing installed at run time. Pinned
    # by digest; keep in sync with CI_IMAGE in .automation.conf.
    container:
      image: ghcr.io/nicwineburger/yahtzee-ci@sha256:fbbe2340f738d780849c0f4390e096501143c0c66002db56855d70794a458230
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm ci
      - name: Engine regression test vs Python-solver fixtures
        run: npm run test:engine
      - name: Engine property tests
        run: npm run test:engine-extra
      - name: UI tests (both modes, mobile viewport)
        run: npm run test:ui

  test-math:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/nicwineburger/yahtzee-ci@sha256:fbbe2340f738d780849c0f4390e096501143c0c66002db56855d70794a458230
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Solver + export tests
        run: python3 test_yacht_clubhouse.py
        working-directory: math

  deploy:
    needs: [test, test-math]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Blob-filtered sparse checkout — skips the 2.5 GiB math/data pack (see claude.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/math/data/
          sparse-checkout-cone-mode: false
      - name: Stamp build version for cache busting
        run: |
          SHA="${GITHUB_SHA::12}"
          sed -i "s/__BUILD__/${SHA}/g" docs/index.html
          printf '{"build":"%s"}\n' "$SHA" > docs/version.json
          grep -q "$SHA" docs/index.html
      # enablement: true creates/enables the Pages site (build type "workflow")
      # on first run, so no manual Settings -> Pages step is needed.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Cuts a semver-tagged GitHub Release with a generated changelog after
  # every successful deploy — see scripts/automation/{release,next-version,
  # changelog}.sh (also what the interactive /release skill runs). Gated to
  # 'push' so a manual workflow_dispatch re-deploy doesn't try to re-release
  # an already-tagged commit (harmless either way: next-version.sh would
  # just report nothing releasable).
  release:
    needs: [deploy]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level override: only this job gets contents:write (to push a tag
    # and create the Release); it does NOT inherit pages:write/id-token:write
    # from the top-level block above, since job-level permissions replace
    # rather than extend the workflow default.
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 + explicit ref: main gives a real (non-detached)
      # local 'main' with full tag history, which require_branch/
      # require_clean_tree in scripts/automation/lib.sh and next-version.sh's
      # `git describe` need. filter: blob:none + sparse-checkout still skips
      # the 2.5 GiB math/data pack (see claude.yml) without losing history.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/math/data/
          sparse-checkout-cone-mode: false
      - name: Configure git identity for tagging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Cut a release if there are releasable commits since the last tag
        env:
          # `gh auth status` (required by lib.sh's require_gh) and
          # `gh release create` both accept GH_TOKEN non-interactively.
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          AUTOMATION_YES=1 scripts/automation/release.sh || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::notice::no releasable commits (feat/fix/perf/revert/breaking) since the last tag — skipping release"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
