name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include errors, screenshots, or console output if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web app (docs/)
        - solver (math/)
        - automation / CI
        - other
    validations:
      required: true
